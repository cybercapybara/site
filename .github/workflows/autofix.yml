# Manually dispatched fixer for the two mechanical gates: clang-format and
# the generated OpenAPI TS schema. Runs on the branch you dispatch it against
# and pushes a fix commit back if anything changed. Exists because local
# builds/tooling are not part of this repo's workflow — everything runs in CI.
name: autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_dispatch checks out the dispatched ref by default — no
      # explicit ref needed (and no ref-injection surface).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Same clang-format major as the lint-format gate — formatting must be
      # byte-identical to what the gate checks.
      - name: Install clang-format 17
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17
          sudo ln -sf /usr/bin/clang-format-17 /usr/local/bin/clang-format

      - name: Format C++ sources
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format -i

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate OpenAPI TS schema
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api

      - name: Commit and push fixes if any
        run: |
          if git diff --quiet; then
            echo "Nothing to fix."
            exit 0
          fi
          git config user.name "moveeeax"
          git config user.email "michael@tarassov.me"
          git add -u
          git commit -m "style: clang-format + regenerate OpenAPI TS schema (autofix)"
          git push
