apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cpp-frontend.fullname" . }}
  labels:
    {{- include "cpp-frontend.labels" . | nindent 4 }}
data:
  # Overrides the nginx.conf baked into the image. The image hardcodes
  # `proxy_pass http://app:8080` (the docker-compose service name), which does
  # not resolve in Kubernetes — here the /api upstream points at the cpp-api
  # Service so the SPA stays the single same-origin entry point (cookies remain
  # first-party). $-prefixed tokens are nginx variables, not Helm.
  default.conf: |
    server {
        # 8080: the image is built FROM nginxinc/nginx-unprivileged, whose
        # master runs as a non-root user and cannot bind privileged ports.
        listen       8080;
        server_name  _;

        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /api/ {
            proxy_pass http://{{ .Values.backend.service }}:{{ .Values.backend.port }};
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
